name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Create release v<POWEROFF_VERSION> (only after testing the build)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  msvc:
    name: MSVC (Win32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A Win32
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: poweroff-msvc-win32
          path: build/Release/poweroff.exe

  mingw:
    name: MinGW (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=build-support/mingw-i686.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: poweroff-mingw-i686
          path: build/poweroff.exe

  release:
    name: Release
    # On demand (workflow_dispatch with release = true) or for a pushed tag v*.
    # The version comes from POWEROFF_VERSION in src/poweroff.h.
    if: (github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/v')
    needs: [msvc, mingw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from poweroff.h
        id: version
        run: echo "version=$(grep -oP '#define POWEROFF_VERSION "\K[^"]+' src/poweroff.h)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: poweroff-msvc-win32
          path: dist
      - name: Create release (if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION exists already"
          else
            gh release create "v$VERSION" dist/poweroff.exe --target "$GITHUB_SHA" \
              --title "Poweroff $VERSION" --notes-file CHANGES.md
          fi
