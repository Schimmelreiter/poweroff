name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msvc:
    name: MSVC (Win32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A Win32
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: poweroff-msvc-win32
          path: build/Release/poweroff.exe

  mingw:
    name: MinGW (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=build-support/mingw-i686.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: poweroff-mingw-i686
          path: build/poweroff.exe

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msvc, mingw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: poweroff-msvc-win32
      - uses: softprops/action-gh-release@v2
        with:
          files: poweroff.exe
          generate_release_notes: true
